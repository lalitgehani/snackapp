name: Tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: snackapp
      - uses: actions/checkout@v4
        with:
          repository: lalitgehani/SnackBase
          ref: pypi-oidc
          path: SnackBase
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test
        working-directory: snackapp
        run: |
          uv sync --dev
          uv run ruff check .
          uv run pytest --cov --cov-fail-under=80
          uv build
      - name: Build snackbase wheel
        working-directory: SnackBase
        run: uv build
      - name: pip-install wheels without uv
        working-directory: snackapp
        shell: bash
        run: |
          python -m venv .ci-venv
          if [ -x .ci-venv/bin/python ]; then
            PY=.ci-venv/bin/python
          else
            PY=.ci-venv/Scripts/python
          fi
          "$PY" -m pip install \
            ../SnackBase/dist/snackbase-0.12.1-py3-none-any.whl \
            dist/snackapp-0.1.1-py3-none-any.whl
          "$PY" -m snackapp --help
          "$PY" -m snackapp --version

  install-testpypi:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: pip install snackapp from TestPyPI
        shell: bash
        run: |
          python -m venv .ci-venv
          if [ -x .ci-venv/bin/python ]; then
            PY=.ci-venv/bin/python
          else
            PY=.ci-venv/Scripts/python
          fi
          "$PY" -m pip install -U pip
          "$PY" -m pip install --only-binary=:all: \
            --extra-index-url https://test.pypi.org/simple/ \
            snackapp==0.1.1 snackbase==0.12.1
          "$PY" -m snackapp --help
          "$PY" -m snackapp --version

[project]
name = "snackapp"
version = "0.1.0"
description = "Python application framework with SnackBase embedded"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "snackbase>=0.12.0",
    "fastapi>=0.127.0",
    "uvicorn[standard]>=0.50.0",
    "httpx>=0.28.1",
    "click>=8.1.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
snackapp = "snackapp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snackapp"]

[tool.hatch.build.targets.sdist]
exclude = ["/tests", "/frontend", "/examples"]

[tool.uv.sources]
snackbase = { path = "../SnackBase", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "httpx>=0.28.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["snackapp"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
check_untyped_defs = false
mypy_path = "src"

[tool.coverage.run]
source = ["src/snackapp"]
omit = ["src/snackapp/__main__.py"]
branch = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=snackapp --cov-report=term-missing"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated.*",
]
